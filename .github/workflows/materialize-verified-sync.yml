name: Materialize verified D-SF sync payload

on:
  push:
    branches:
      - sync/r3-r5d-verified-hw04
    paths:
      - .github/workflows/materialize-verified-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: sync/r3-r5d-verified-hw04
          fetch-depth: 0

      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .sync/part-00.b64 \
            .sync/part-01.b64 \
            .sync/part-02.b64 \
            .sync/part-03.b64 \
            .sync/part-04.b64 \
            .sync/part-05.b64 \
            .sync/part-06.b64 \
            .sync/part-07.b64 \
            .sync/part-08a.b64 \
            .sync/part-08b.b64 \
            .sync/part-09.b64 \
            .sync/part-10.b64 \
            .sync/part-11ab.b64 \
            .sync/part-11cd.b64 \
            > /tmp/dsf-sync-payload.b64
          base64 --decode /tmp/dsf-sync-payload.b64 > /tmp/dsf-sync-payload.tar.gz
          echo "63bdf9ac84e1f165a01b94bb463e00c99ee875cde413259fe6ce850c6ee25f42  /tmp/dsf-sync-payload.tar.gz" | sha256sum --check --strict
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          p = Path('/tmp/dsf-sync-payload.tar.gz')
          with tarfile.open(p, 'r:gz') as tf:
              for m in tf.getmembers():
                  n = m.name
                  if n.startswith('/') or '..' in Path(n).parts:
                      raise SystemExit(f'unsafe archive member: {n}')
          PY
          tar -xzf /tmp/dsf-sync-payload.tar.gz
          test -f SYNC_MANIFEST.json
          mv SYNC_MANIFEST.json docs/SYNC_MANIFEST_R3_R5D.json

      - name: Remove transport-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/materialize-verified-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sync: materialize verified R3-R5D source and closeouts"
          git push origin HEAD:sync/r3-r5d-verified-hw04
