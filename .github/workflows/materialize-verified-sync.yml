name: Materialize verified D-SF sync payload

on:
  push:
    branches:
      - sync/r3-r5d-verified-hw04
    paths:
      - .github/workflows/materialize-verified-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: sync/r3-r5d-verified-hw04
          fetch-depth: 0

      - name: Repair transport chunks against immutable half digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          expected = {
              '12a': 'a4c3642acbbe2aa8c3eee7a966234edd1cb66d79',
              '12b': 'a4b4c17299ab11b3c8e65259effc1b28c7fa758d',
              '13a': '826be3dac9469ff655a5d9c1d92e350492968f58',
              '13b': 'ecef89d883a76e350968e59c0530868c2007719d',
          }
          def h(b): return hashlib.sha1(b).hexdigest()
          def read(name): return Path('.sync', name).read_bytes()

          def find_substitute(base, target, label):
              assert len(base) == 8000
              if h(base) == target:
                  print(f'{label}: already exact')
                  return base
              a = bytearray(base)
              for i, old in enumerate(base):
                  for c in alphabet:
                      if c == old:
                          continue
                      a[i] = c
                      if h(a) == target:
                          print(f'{label}: substitution repair pos={i} {chr(old)}->{chr(c)}')
                          return bytes(a)
                  a[i] = old
              raise SystemExit(f'{label}: not repairable as one substitution; sha1={h(base)}')

          def find_insert(base, target, label):
              assert len(base) == 7999
              for i in range(8000):
                  pre, post = base[:i], base[i:]
                  for c in alphabet:
                      cand = pre + bytes([c]) + post
                      if h(cand) == target:
                          print(f'{label}: insertion repair pos={i} char={chr(c)}')
                          return cand
              raise SystemExit(f'{label}: not repairable as one deletion')

          p12 = read('part-12.b64')
          if len(p12) != 16000:
              raise SystemExit(f'part-12 unexpected length {len(p12)}')
          p12a = find_substitute(p12[:8000], expected['12a'], 'part-12a')
          p12b = find_substitute(p12[8000:], expected['12b'], 'part-12b')
          Path('/tmp/part-12a.b64').write_bytes(p12a)
          Path('/tmp/part-12b.b64').write_bytes(p12b)

          p13 = read('part-13.b64')
          if len(p13) == 16000 and h(p13[:8000]) == expected['13a'] and h(p13[8000:]) == expected['13b']:
              p13a, p13b = p13[:8000], p13[8000:]
              print('part-13: already exact')
          elif len(p13) == 15999:
              if h(p13[:8000]) == expected['13a']:
                  p13a = p13[:8000]
                  p13b = find_insert(p13[8000:], expected['13b'], 'part-13b')
              elif h(p13[7999:]) == expected['13b']:
                  p13a = find_insert(p13[:7999], expected['13a'], 'part-13a')
                  p13b = p13[7999:]
              else:
                  repaired = None
                  for i in range(16000):
                      for c in alphabet:
                          cand = p13[:i] + bytes([c]) + p13[i:]
                          if h(cand[:8000]) == expected['13a'] and h(cand[8000:]) == expected['13b']:
                              repaired = cand
                              print(f'part-13: full insertion repair pos={i} char={chr(c)}')
                              break
                      if repaired is not None:
                          break
                  if repaired is None:
                      raise SystemExit('part-13: unable to repair one-character deletion')
                  p13a, p13b = repaired[:8000], repaired[8000:]
          else:
              raise SystemExit(f'part-13 unexpected len={len(p13)} sha1a={h(p13[:8000])} sha1b={h(p13[8000:])}')

          if h(p12a) != expected['12a'] or h(p12b) != expected['12b']:
              raise SystemExit('part-12 repaired digest mismatch')
          if h(p13a) != expected['13a'] or h(p13b) != expected['13b']:
              raise SystemExit('part-13 repaired digest mismatch')
          Path('/tmp/part-13a.b64').write_bytes(p13a)
          Path('/tmp/part-13b.b64').write_bytes(p13b)
          print('chunk repair verified')
          PY

      - name: Reconstruct and verify immutable archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .sync/part-00.b64 \
            .sync/part-01.b64 \
            .sync/part-02.b64 \
            .sync/part-03.b64 \
            .sync/part-04.b64 \
            .sync/part-05.b64 \
            .sync/part-06.b64 \
            .sync/part-07.b64 \
            .sync/part-08a.b64 \
            .sync/part-08b.b64 \
            .sync/part-09.b64 \
            .sync/part-10.b64 \
            .sync/part-11ab.b64 \
            .sync/part-11cd.b64 \
            /tmp/part-12a.b64 \
            /tmp/part-12b.b64 \
            /tmp/part-13a.b64 \
            /tmp/part-13b.b64 \
            .sync/part-14.b64 \
            .sync/part-15.b64 \
            > /tmp/dsf-sync-payload.b64
          test "$(wc -c < /tmp/dsf-sync-payload.b64)" -eq 234604
          base64 --decode /tmp/dsf-sync-payload.b64 > /tmp/dsf-sync-payload.tar.gz
          echo "63bdf9ac84e1f165a01b94bb463e00c99ee875cde413259fe6ce850c6ee25f42  /tmp/dsf-sync-payload.tar.gz" | sha256sum --check --strict
          test "$(wc -c < /tmp/dsf-sync-payload.tar.gz)" -eq 175951

      - name: Verify archive safety and extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          p = Path('/tmp/dsf-sync-payload.tar.gz')
          with tarfile.open(p, 'r:gz') as tf:
              for m in tf.getmembers():
                  n = m.name
                  if n.startswith('/') or '..' in Path(n).parts:
                      raise SystemExit(f'unsafe archive member: {n}')
          PY
          tar -xzf /tmp/dsf-sync-payload.tar.gz
          test -f SYNC_MANIFEST.json
          mv SYNC_MANIFEST.json docs/SYNC_MANIFEST_R3_R5D.json

      - name: Verify every materialized payload file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('docs/SYNC_MANIFEST_R3_R5D.json').read_text())
          errors=[]
          for rec in manifest['files']:
              p=Path(rec['path'])
              if not p.is_file():
                  errors.append(f'missing {p}')
                  continue
              data=p.read_bytes()
              if len(data)!=rec['bytes']:
                  errors.append(f'bytes {p}: {len(data)} != {rec["bytes"]}')
              got=hashlib.sha256(data).hexdigest()
              if got!=rec['sha256']:
                  errors.append(f'sha256 {p}: {got} != {rec["sha256"]}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f"manifest verified: {len(manifest['files'])} files")
          PY

      - name: Build and test materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dsf-sync-build
          cmake -S . -B /tmp/dsf-sync-build -DCMAKE_BUILD_TYPE=Release -DAION_ENABLE_WARNINGS=ON
          cmake --build /tmp/dsf-sync-build -j2
          ctest --test-dir /tmp/dsf-sync-build --output-on-failure
          ctest --test-dir /tmp/dsf-sync-build -N | grep -F 'Total Tests: 17'

      - name: Remove transport-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/materialize-verified-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "D-SF Research Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sync: materialize verified R3-R5D source and R5E HW01-HW04 record"
          git push origin HEAD:sync/r3-r5d-verified-hw04
