name: Materialize verified D-SF sync payload

on:
  push:
    branches:
      - sync/r3-r5d-verified-hw04
    paths:
      - .github/workflows/materialize-verified-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: sync/r3-r5d-verified-hw04
          fetch-depth: 0

      - name: Resolve chunk order by immutable archive digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, itertools
          from pathlib import Path

          expected = '63bdf9ac84e1f165a01b94bb463e00c99ee875cde413259fe6ce850c6ee25f42'
          fixed_names = [f'part-{i:02d}.b64' for i in range(8)]
          suspect_names = [
              'part-08.b64', 'part-08a.b64', 'part-08b.b64',
              'part-09.b64', 'part-10.b64', 'part-11ab.b64', 'part-11cd.b64'
          ]

          def read(name):
              return Path('.sync', name).read_bytes()

          # All transport chunks are slices on 4-character Base64 boundaries.
          # Decode each once, then search only over concatenation order/subset.
          decoded = {}
          for name in fixed_names + suspect_names:
              raw = read(name)
              if len(raw) % 4:
                  raise SystemExit(f'non-canonical base64 boundary: {name} size={len(raw)}')
              if b'=' in raw:
                  raise SystemExit(f'unexpected padding in transport chunk: {name}')
              decoded[name] = base64.b64decode(raw, validate=True)

          prefix = b''.join(decoded[n] for n in fixed_names)
          found = None
          tested = 0
          for k in range(1, len(suspect_names) + 1):
              for order in itertools.permutations(suspect_names, k):
                  tested += 1
                  payload = prefix + b''.join(decoded[n] for n in order)
                  if hashlib.sha256(payload).hexdigest() == expected:
                      found = order
                      Path('/tmp/dsf-sync-payload.tar.gz').write_bytes(payload)
                      break
              if found:
                  break

          print(f'candidate sequences tested: {tested}')
          if not found:
              # Diagnostics useful if the immutable digest cannot be reconstructed.
              a = read('part-08.b64')
              b = read('part-08a.b64') + read('part-08b.b64')
              print(f'part08 == part08a+part08b: {a == b}')
              print(f'part08 sha256: {hashlib.sha256(a).hexdigest()}')
              print(f'part08ab sha256: {hashlib.sha256(b).hexdigest()}')
              raise SystemExit('no chunk sequence reproduces immutable archive digest')

          print('resolved order: ' + ' '.join(fixed_names + list(found)))
          print('archive sha256: ' + expected)
          PY
          echo "63bdf9ac84e1f165a01b94bb463e00c99ee875cde413259fe6ce850c6ee25f42  /tmp/dsf-sync-payload.tar.gz" | sha256sum --check --strict

      - name: Verify archive safety and extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          p = Path('/tmp/dsf-sync-payload.tar.gz')
          with tarfile.open(p, 'r:gz') as tf:
              for m in tf.getmembers():
                  n = m.name
                  if n.startswith('/') or '..' in Path(n).parts:
                      raise SystemExit(f'unsafe archive member: {n}')
          PY
          tar -xzf /tmp/dsf-sync-payload.tar.gz
          test -f SYNC_MANIFEST.json
          mv SYNC_MANIFEST.json docs/SYNC_MANIFEST_R3_R5D.json

      - name: Verify every materialized payload file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('docs/SYNC_MANIFEST_R3_R5D.json').read_text())
          errors=[]
          for rec in manifest['files']:
              p=Path(rec['path'])
              if not p.is_file():
                  errors.append(f'missing {p}')
                  continue
              data=p.read_bytes()
              if len(data)!=rec['bytes']:
                  errors.append(f'bytes {p}: {len(data)} != {rec["bytes"]}')
              got=hashlib.sha256(data).hexdigest()
              if got!=rec['sha256']:
                  errors.append(f'sha256 {p}: {got} != {rec["sha256"]}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f"manifest verified: {len(manifest['files'])} files")
          PY

      - name: Build and test materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dsf-sync-build
          cmake -S . -B /tmp/dsf-sync-build -DCMAKE_BUILD_TYPE=Release -DAION_ENABLE_WARNINGS=ON
          cmake --build /tmp/dsf-sync-build -j2
          ctest --test-dir /tmp/dsf-sync-build --output-on-failure
          ctest --test-dir /tmp/dsf-sync-build -N | grep -F 'Total Tests: 17'

      - name: Remove transport-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .sync
          rm -f .github/workflows/materialize-verified-sync.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit materialized verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "D-SF Research Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sync: materialize verified R3-R5D source and R5E HW01-HW04 record"
          git push origin HEAD:sync/r3-r5d-verified-hw04
